services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: lti
      POSTGRES_PASSWORD: lti
      POSTGRES_DB: la_toile_intelligente
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lti -d la_toile_intelligente']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
